name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Build Flutter App from scratch
        run: |
          # 1. Создаем чистый проект со всеми системными файлами Android
          flutter create app --platforms=android --org com.exhaust.sim
          cd app
          
          # 2. Автоматически добавляем аудио-библиотеку
          flutter pub add audioplayers
          
          # 3. Подставляем ваш код main.dart
          if [ -f ../main.dart ]; then
            cp ../main.dart lib/main.dart
          elif [ -f ../lib/main.dart ]; then
            cp ../lib/main.dart lib/main.dart
          fi
          
          # 4. Собираем готовый релизный APK
          flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: exhaust-sound-app
          path: app/build/app/outputs/flutter-apk/app-release.apk
